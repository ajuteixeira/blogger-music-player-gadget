<!-- CONTAINER DO PLAYER -->
<div class="custom-music-player">
    <div id="youtube-player-container" style="display: none;"></div>

    <div class="player-header">
        <!-- LINK DA CAPA DO ALBUM -->
        <img id="player-cover" src="LINK_DA_CAPA_DO_ALBUM_AQUI" alt="Capa" />
        <div class="player-info">
            <!-- NOME DA MUSICA -->
            <div id="player-title" class="song-title">NOME_DA_MUSICA_AQUI</div>
            <!-- NOME DO ARTISTA -->
            <div id="player-artist" class="artist-name">NOME_DO_ARTISTA_AQUI</div>
        </div>
    </div>

    <div class="player-progress">
        <div class="time-container">
            <span id="current-time">0:00</span>
            <span id="total-time">0:00</span>
        </div>
        <input type="range" id="progress-bar" min="0" max="100" value="0" />
    </div>

    <div class="player-controls">
        <div class="controls-left">
            <button id="btn-prev" title="Anterior">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M3.18 11.18l6.59-4.63a.996.996 0 0 1 1.58.81v9.27c0 .81-.91 1.28-1.58.82l-6.59-4.64a.996.996 0 0 1 0-1.63zm10.46 0l6.59-4.63a.996.996 0 0 1 1.58.81v9.27c0 .81-.91 1.28-1.58.82l-6.59-4.64a.996.996 0 0 1 0-1.63z" /></path></svg>
            </button>
            <button id="btn-play-pause" title="Play/Pause">
                <svg id="icon-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18c.62-.39.62-1.29 0-1.69L9.54 5.98C8.87 5.55 8 6.03 8 6.82z" /></path></svg>
                <svg id="icon-pause" style="display: none;" viewBox="0 0 24 24"><path fill="currentColor" d="M8 19c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2s-2 .9-2 2v10c0 1.1.9 2 2 2zm6-12v10c0 1.1.9 2 2 2s2-.9 2-2V7c0-1.1-.9-2-2-2s-2 .9-2 2z" /></path></svg>
            </button>
            <button id="btn-next" title="Próxima">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M10.82 11.18L4.23 6.55A.996.996 0 0 0 2.64 7.36v9.27c0 .81.91 1.28 1.58.82l6.59-4.64a.996.996 0 0 0 0-1.63zm10.46 0l-6.59-4.63a.996.996 0 0 0-1.58.81v9.27c0 .81.91 1.28 1.58.82l6.59-4.64a.996.996 0 0 0 0-1.63z" /></path></svg>
            </button>
        </div>
        <div class="controls-right">
            <button id="btn-repeat" title="Repetir">
                <svg id="icon-repeat" viewBox="0 0 24 24"><path fill="currentColor" d="M7 7h10v1.79c0 .45.54.67.85.35l2.79-2.79c.2-.2.2-.51 0-.71l-2.79-2.79a.5.5 0 0 0-.85.35V5H6c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1s1-.45 1-1V7zm10 10H7v-1.79c0-.45-.54-.67-.85-.35l-2.79 2.79c-.2.2-.2.51 0 .71l2.79 2.79a.5.5 0 0 0 .85-.35V19h11c.55 0 1-.45 1-1v-4c0-.55-.45-1-1-1s-1 .45-1 1v3z" /></path></svg>
                <svg id="icon-repeat-one" style="display: none;" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M13 15V9h-1l-2 1v1h1.5v4H13z" />
                    <path fill="currentColor" d="M7 7h10v1.79c0 .45.54.67.85.35l2.79-2.79c.2-.2.2-.51 0-.71l-2.79-2.79a.5.5 0 0 0-.85.35V5H6c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1s1-.45 1-1V7zm10 10H7v-1.79c0-.45-.54-.67-.85-.35l-2.79 2.79c-.2.2-.2.51 0 .71l2.79 2.79a.5.5 0 0 0 .85-.35V19h11c.55 0 1-.45 1-1v-4c0-.55-.45-1-1-1s-1 .45-1 1v3z" />
                </svg>
            </button>
            <div class="volume-wrapper">
                <button id="btn-volume" title="Volume">
                    <svg id="icon-vol-on" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" /></path></svg>
                    <svg id="icon-vol-off" style="display:none;" viewBox="0 0 24 24"><path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" /></path></svg>
                </button>
                <input type="range" id="volume-slider" min="0" max="100" value="100" />
            </div>
        </div>
    </div>
</div>

<!-- ESTILOS (CSS) -->
<style>
    .custom-music-player {
        background-color: #f0eefc; /* COR DE FUNDO DO PLAYER */
        border-radius: 12px;
        padding: 20px;
        width: 100%;
        max-width: 320px;
        box-sizing: border-box;
        font-family: 'DM Sans', sans-serif;
        font-size: 13px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        margin: 0 auto;
    }
    
    .player-header { display: flex; align-items: center; margin-bottom: 5px; }
    .player-header img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .player-info { margin-left: 15px; display: flex; flex-direction: column; justify-content: center; }
    
    .song-title {
        color: #7e459b; /* COR DO TITULO DA MUSICA */
        font-size: 13px; font-weight: bold; margin-bottom: 0px; line-height: 1.2;
    }
    
    .artist-name {
        color: #7e459b; /* COR DO NOME DO ARTISTA */
        font-size: 13px; font-weight: normal; opacity: 0.9;
    }

    .time-container {
        color: #7e459b; /* COR DO NUMERO DO TEMPO */
        display: flex; justify-content: space-between; font-size: 11px; margin: 8px 0 0 0; font-weight: 500;
    }
    
    .player-progress { margin-bottom: 10px; }
    
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; height: 6px; border-radius: 5px; outline: none; cursor: pointer; }
    
    input[type=range]::-webkit-slider-runnable-track {
        background: #d5c8ec; /* COR DE FUNDO DAS BARRAS */
        width: 100%; height: 6px; border-radius: 5px;
    }
    
    input[type=range]::-webkit-slider-thumb {
        background: #7e459b; /* COR DA BOLINHA DAS BARRAS */
        -webkit-appearance: none; height: 13px; width: 13px; border-radius: 50%; margin-top: -4px; transition: transform 0.1s;
    }
    input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.2); }

    input[type=range]::-moz-range-track {
        background: #d5c8ec; /* COR DE FUNDO DAS BARRAS (FIREFOX) */
        width: 100%; height: 6px; border-radius: 5px;
    }

    input[type=range]::-moz-range-thumb {
        background: #7e459b; /* COR DA BOLINHA DAS BARRAS (FIREFOX) */
        height: 13px; width: 13px; border-radius: 50%; border: none;
    }

    .player-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .controls-left, .controls-right { display: flex; align-items: center; gap: 12px; }
    .volume-wrapper { display: flex; align-items: center; }

    #volume-slider {
        background: #7e459b; /* COR BASE DA BARRA DE VOLUME */
        width: 0; opacity: 0; margin-left: 0; pointer-events: none; transition: width 0.3s ease, opacity 0.3s ease, margin-left 0.3s ease;
    }
    #volume-slider.show { width: 55px; opacity: 1; margin-left: 8px; pointer-events: auto; }
    
    #volume-slider::-webkit-slider-runnable-track { height: 4px; }
    #volume-slider::-webkit-slider-thumb { height: 11px; width: 11px; margin-top: -3.5px; }
    #volume-slider::-moz-range-track { height: 4px; }
    #volume-slider::-moz-range-thumb { height: 11px; width: 11px; }
    
    .player-controls button {
        color: #7e459b; /* COR DOS ICONES */
        background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; transition: transform 0.1s ease;
    }
    .player-controls button:hover { transform: scale(1.1); }
    .player-controls svg { width: 18px; height: 18px; }
    #btn-play-pause svg { width: 20px; height: 20px; }
</style>

<!-- SCRIPTS (LÓGICA E YOUTUBE API) -->
<script>
    const CONFIG = {
        youtubeUrl: "LINK_DO_VIDEO_YOUTUBE_AQUI", /* LINK DO VIDEO DO YOUTUBE */
        coverImage: "LINK_DA_CAPA_DO_ALBUM_AQUI", /* LINK DA CAPA DO ALBUM */
        title: "NOME_DA_MUSICA_AQUI", /* NOME DA MUSICA */                        
        artist: "NOME_DO_ARTISTA_AQUI" /* NOME DO ARTISTA */                      
    };

    document.getElementById('player-cover').src = CONFIG.coverImage;
    document.getElementById('player-title').innerText = CONFIG.title;
    document.getElementById('player-artist').innerText = CONFIG.artist;

    function getYouTubeID(url) {
        let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        let match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }
    const videoId = getYouTubeID(CONFIG.youtubeUrl);

    let player;
    let isPlaying = false;
    let isRepeating = false;
    let isMuted = false;
    let currentVolume = 100;
    let progressInterval;

    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('youtube-player-container', {
            height: '0', width: '0', videoId: videoId,
            playerVars: { 'playsinline': 1, 'controls': 0, 'disablekb': 1 },
            events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
        });
    }

    function onPlayerReady(event) {
        const btnPlay = document.getElementById('btn-play-pause');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnRepeat = document.getElementById('btn-repeat');
        const btnVolume = document.getElementById('btn-volume');
        const progressBar = document.getElementById('progress-bar');
        const volumeSlider = document.getElementById('volume-slider');

        setTimeout(() => { document.getElementById('total-time').innerText = formatTime(player.getDuration()); }, 1000);
        player.setVolume(currentVolume);
        updateVolumeVisual(currentVolume);

        btnPlay.addEventListener('click', () => { isPlaying ? player.pauseVideo() : player.playVideo(); });
        btnNext.addEventListener('click', () => { player.seekTo(player.getCurrentTime() + 10, true); });
        btnPrev.addEventListener('click', () => { player.seekTo(player.getCurrentTime() - 10, true); });
        btnVolume.addEventListener('click', () => { volumeSlider.classList.toggle('show'); });

        volumeSlider.addEventListener('input', (e) => {
            const vol = e.target.value;
            currentVolume = vol; 
            player.setVolume(vol);
            updateVolumeVisual(vol);
            if (vol == 0) {
                isMuted = true; player.mute();
                document.getElementById('icon-vol-on').style.display = 'none';
                document.getElementById('icon-vol-off').style.display = 'block';
            } else {
                isMuted = false; player.unMute();
                document.getElementById('icon-vol-on').style.display = 'block';
                document.getElementById('icon-vol-off').style.display = 'none';
            }
        });

        btnRepeat.addEventListener('click', () => {
            isRepeating = !isRepeating;
            document.getElementById('icon-repeat').style.display = isRepeating ? 'none' : 'block';
            document.getElementById('icon-repeat-one').style.display = isRepeating ? 'block' : 'none';
        });

        progressBar.addEventListener('input', (e) => {
            const seekTo = player.getDuration() * (e.target.value / 100);
            player.seekTo(seekTo, true);
            updateProgressBarVisual(e.target.value);
        });
    }

    function onPlayerStateChange(event) {
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');

        if (event.data == YT.PlayerState.PLAYING) {
            isPlaying = true; iconPlay.style.display = 'none'; iconPause.style.display = 'block'; startProgressBar();
        } else {
            isPlaying = false; iconPlay.style.display = 'block'; iconPause.style.display = 'none'; stopProgressBar();
        }

        if (event.data == YT.PlayerState.ENDED) {
            if (isRepeating) {
                player.seekTo(0); player.playVideo();
            } else {
                document.getElementById('progress-bar').value = 0;
                document.getElementById('current-time').innerText = "0:00";
                updateProgressBarVisual(0);
            }
        }
    }

    function startProgressBar() {
        progressInterval = setInterval(() => {
            const currentTime = player.getCurrentTime();
            const duration = player.getDuration();
            const percentage = (currentTime / duration) * 100;
            document.getElementById('current-time').innerText = formatTime(currentTime);
            document.getElementById('progress-bar').value = percentage;
            updateProgressBarVisual(percentage);
        }, 500);
    }

    function stopProgressBar() { clearInterval(progressInterval); }

    function formatTime(time) {
        if(!time) return "0:00";
        time = Math.round(time);
        let minutes = Math.floor(time / 60);
        let seconds = time % 60;
        return minutes + ":" + (seconds < 10 ? '0' + seconds : seconds);
    }

    function updateProgressBarVisual(percentage) {
        const progressBar = document.getElementById('progress-bar');
        /* #7e459b = COR DA BARRA DE PROGRESSO PREENCHIDA | #d5c8ec = COR DE FUNDO DA BARRA DE PROGRESSO */
        progressBar.style.background = `linear-gradient(to right, #7e459b 0%, #7e459b ${percentage}%, #d5c8ec ${percentage}%, #d5c8ec 100%)`;
    }

    function updateVolumeVisual(percentage) {
        const volumeSlider = document.getElementById('volume-slider');
        /* #7e459b = COR DA BARRA DE VOLUME PREENCHIDA | #d5c8ec = COR DE FUNDO DA BARRA DE VOLUME */
        volumeSlider.style.background = `linear-gradient(to right, #7e459b 0%, #7e459b ${percentage}%, #d5c8ec ${percentage}%, #d5c8ec 100%)`;
    }
</script>
